name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install
      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      # This project uses Swift Package Manager (see ios/App/CapApp-SPM), not
      # CocoaPods - there is no Podfile and no .xcworkspace to install/build
      # against. Xcode resolves the CapApp-SPM package automatically as part
      # of the build below, so no separate "pod install" step is needed.

      # --- UNSIGNED BUILD (works with zero setup, good for a first test) ---
      - name: Build for iOS Simulator (no signing needed)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            build

      - name: Upload simulator build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSA-App-Simulator-Build
          path: ios/App/build/Build/Products/Debug-iphonesimulator

      - name: Build unsigned app for real device
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package as unsigned IPA
        run: |
          cd ios/App/build/Build/Products/Release-iphoneos
          mkdir Payload
          cp -r App.app Payload/
          zip -r App.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: RSA-App-Unsigned-IPA
          path: ios/App/build/Build/Products/Release-iphoneos/App.ipa

