name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      # --- UNSIGNED BUILD (works with zero setup, good for a first test) ---
      - name: Build for iOS Simulator (no signing needed)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            build

      - name: Upload simulator build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSA-App-Simulator-Build
          path: ios/App/build/Build/Products/Debug-iphonesimulator

